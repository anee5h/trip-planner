name: Editorial Freshness Report

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run report:editorial-freshness
      - uses: actions/upload-artifact@v4
        with:
          name: editorial-freshness-report
          path: reports/editorial-freshness.*
