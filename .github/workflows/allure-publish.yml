# KAI-126: publish the aggregated Allure E2E dashboard to PRIVATE R2 storage.
#
# Runs on push to main (post-merge). It re-runs the FULL KAI-99 topology —
# the same 4 weighted bins x 2 projects plus the dedicated PWA production
# E2E job — then aggregates all allure-results and uploads the generated
# report to a private Cloudflare R2 bucket. The dashboard is served at
# /e2e ONLY through the Access-guarded Pages Function (functions/e2e/[[path]].js);
# the R2 bucket has no public access, and NOTHING is committed to this repo.
#
# History (KAI-126): Allure 2 requires the previous report's history/
# directory to be copied into the result set BEFORE generation. We download
# the previous report from R2, extract history/ into allure-results/, then
# generate. Bounded retention: 30 days (older history is dropped by R2
# lifecycle rules; the code also prunes history entries beyond 90 runs).
#
# Requires owner-provided secrets:
#   CLOUDFLARE_API_TOKEN  (wrangler:edit on the R2 bucket)
#   CLOUDFLARE_ACCOUNT_ID
#   E2E_REPORT_BUCKET     (R2 bucket name; default E2E_REPORT)
#
# Metadata: an executor.json is written into the result set before
# generation, carrying commit SHA, branch, PR and workflow-run links, so
# the dashboard shows which CI build produced it.

name: Allure Publish (R2)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: allure-publish
  cancel-in-progress: true

env:
  E2E_REPORT_BUCKET: ${{ vars.E2E_REPORT_BUCKET || 'E2E_REPORT' }}

jobs:
  e2e:
    name: E2E (${{ matrix.project }} bin ${{ matrix.bin }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, chromium-desktop]
        bin: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Playwright E2E (bin ${{ matrix.bin }}/4 · ${{ matrix.project }})
        shell: bash
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          CI_BIN: ${{ matrix.bin }}
        run: |
          set -o pipefail
          npx playwright test --project=${{ matrix.project }} $(node scripts/e2e-shards.mjs --bin ${{ matrix.bin }}) 2>&1 | tee /tmp/e2e-output.log

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}-bin${{ matrix.bin }}
          path: allure-results/
          if-no-files-found: ignore

  pwa-e2e:
    name: PWA E2E (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      - name: PWA E2E against the production build
        run: npm run test:pwa

      - name: Upload Allure results (PWA)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-pwa
          path: allure-results/
          if-no-files-found: ignore

  aggregate-and-publish:
    name: Aggregate + publish to R2
    runs-on: ubuntu-latest
    needs: [e2e, pwa-e2e]
    # Privacy gate (KAI-126): the FIRST production report must be manually
    # inspected before automatic publishing. Set the repository variable
    # ALLURE_PUBLISH_READY=1 once a representative report has been checked
    # for email/JWT/Supabase-token leakage. Until then this job scans and
    # stages but does NOT upload.
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results from all E2E jobs
        uses: actions/download-artifact@v4
        with:
          path: allure-download
          pattern: allure-results-*
          merge-multiple: true

      - name: Restore previous report history from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Allure 2 history: the ENTIRE history/ directory (history.json,
          # history-trend.json, duration-trend.json, categories-trend.json,
          # retry-trend.json) must be copied into the NEW result set BEFORE
          # generation. R2 object get uses the single bucket/key path.
          mkdir -p previous-report allure-download/history
          for hf in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            npx wrangler r2 object get "$E2E_REPORT_BUCKET/history/$hf" --remote \
              -o "previous-report/$hf" 2>/dev/null || echo "  (no previous $hf — first run)"
          done
          if ls previous-report/*.json >/dev/null 2>&1; then
            cp previous-report/*.json allure-download/history/
            echo "restored previous history: $(ls previous-report | wc -l) file(s)"
          fi

      - name: Write executor.json (CI metadata with monotonic buildOrder)
        run: |
          cat > allure-download/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildName": "${{ github.ref_name }} @ ${{ github.sha }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Meguruto E2E Dashboard",
            "reportUrl": "https://meguruto.app/e2e",
            "buildOrder": ${{ github.run_number }}
          }
          EOF
          echo "executor.json written (buildOrder=${{ github.run_number }})"

      - name: Generate Allure report
        run: |
          npx allure generate allure-download -o allure-report --clean
          echo "Allure report generated."

      - name: Privacy/secrets scan of generated report
        run: node scripts/check-allure-privacy.mjs allure-report

      - name: Upload report to R2 (private, not the repo)
        if: ${{ vars.ALLURE_PUBLISH_READY == '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Upload the full report tree to the private bucket. Wrangler R2
          # uses a single bucket/key object path; --content-type preserves
          # correct MIME so the Function serves CSS/JS/JSON/HTML properly.
          cd allure-report
          for f in $(find . -type f); do
            key="${f#./}"
            ct="application/octet-stream"
            case "$key" in
              *.html) ct="text/html; charset=utf-8" ;;
              *.js)   ct="application/javascript" ;;
              *.css)  ct="text/css" ;;
              *.json) ct="application/json" ;;
              *.svg)  ct="image/svg+xml" ;;
              *.png)  ct="image/png" ;;
              *.jpg|*.jpeg) ct="image/jpeg" ;;
              *.gif)  ct="image/gif" ;;
              *.woff2) ct="font/woff2" ;;
              *.woff) ct="font/woff" ;;
              *.webp) ct="image/webp" ;;
            esac
            npx wrangler r2 object put "$E2E_REPORT_BUCKET/$key" --file "$f" --content-type "$ct" --remote
          done
          echo "Uploaded $(find . -type f | wc -l) files to R2 bucket $E2E_REPORT_BUCKET"

      - name: Privacy gate not ready — report staged, not published
        if: ${{ vars.ALLURE_PUBLISH_READY != '1' }}
        run: |
          echo "::warning::ALLURE_PUBLISH_READY is not set to 1. The report was generated and privacy-scanned but NOT uploaded to R2. Set the repository variable ALLURE_PUBLISH_READY=1 after inspecting a representative report (see docs/search-console-workflow or the PR body)."
