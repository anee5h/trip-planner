# KAI-126: publish the aggregated Allure E2E dashboard to PRIVATE R2 storage.
#
# Lightweight publisher — NO browser/test execution happens here.
#
# Trigger: `push` to main (GENUINELY post-merge — not workflow_run, which
# fires after every successful PR Checks run whether or not the PR merged).
# On a main push (a merge), we locate the PR whose head matches the merged
# commit, find its SUCCESSFUL "PR Checks" run, and download the sanitized
# allure-results-* artifacts from that exact run (matching the merged head
# SHA). Then:
#   1. restore the previous report's history/ from R2 (Allure 2 mechanism)
#   2. write executor.json with buildOrder + CI metadata
#   3. generate the report
#   4. privacy-scan the generated report
#   5. upload to the private R2 bucket (no repo commit; correct MIME)
#
# This saves ~9 redundant E2E jobs per merge (no double execution).

name: Allure Publish (R2)

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: allure-publish
  cancel-in-progress: true

env:
  E2E_REPORT_BUCKET: ${{ vars.E2E_REPORT_BUCKET || 'E2E_REPORT' }}

jobs:
  aggregate-and-publish:
    name: Aggregate + publish to R2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Find merged PR + its successful PR Checks run
        id: find-pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          # The pushed commit is the merge commit; its first parent is the
          # pre-merge main, and the PR head is the commit merged in.
          PR_HEAD=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].head.sha // empty' 2>/dev/null || true)
          if [ -z "$PR_HEAD" ]; then
            echo "::warning::No associated PR found for $MERGE_SHA — skipping publish (direct push or no PR)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Find the latest SUCCESSFUL "PR Checks" workflow run for that head.
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=$PR_HEAD&event=pull_request&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "PR Checks") | .id][0] // empty' 2>/dev/null || true)
          if [ -z "$RUN_ID" ]; then
            echo "::warning::No successful PR Checks run for merged head $PR_HEAD — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "pr_head=$PR_HEAD" >> "$GITHUB_OUTPUT"
          echo "Found PR Checks run $RUN_ID for merged head $PR_HEAD"

      - name: Download sanitized Allure results from the merged PR's run
        if: ${{ steps.find-pr.outputs.skip != 'true' }}
        uses: actions/download-artifact@v4
        with:
          path: allure-download
          pattern: allure-results-*
          merge-multiple: true
          run-id: ${{ steps.find-pr.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore previous report history from R2
        if: ${{ steps.find-pr.outputs.skip != 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Allure 2 history: the ENTIRE history/ directory must be copied
          # into the new result set BEFORE generation. R2 uses the single
          # bucket/key path.
          mkdir -p previous-report allure-download/history
          for hf in history.json history-trend.json duration-trend.json categories-trend.json retry-trend.json; do
            npx wrangler r2 object get "$E2E_REPORT_BUCKET/history/$hf" --remote \
              -o "previous-report/$hf" 2>/dev/null || echo "  (no previous $hf — first run)"
          done
          if ls previous-report/*.json >/dev/null 2>&1; then
            cp previous-report/*.json allure-download/history/
            echo "restored previous history: $(ls previous-report | wc -l) file(s)"
          fi

      - name: Write executor.json (CI metadata with monotonic buildOrder)
        if: ${{ steps.find-pr.outputs.skip != 'true' }}
        run: |
          cat > allure-download/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find-pr.outputs.run_id }}",
            "buildName": "main @ ${{ github.sha }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.find-pr.outputs.run_id }}",
            "reportName": "Meguruto E2E Dashboard",
            "reportUrl": "https://meguruto.app/e2e",
            "buildOrder": ${{ github.run_number }}
          }
          EOF
          echo "executor.json written (buildOrder=${{ github.run_number }})"

      - name: Generate Allure report (analytics off)
        if: ${{ steps.find-pr.outputs.skip != 'true' }}
        run: |
          ALLURE_NO_ANALYTICS=1 npx allure generate allure-download -o allure-report --clean
          echo "Allure report generated (ALLURE_NO_ANALYTICS=1)."

      - name: Strip GTM analytics from generated HTML (defense in depth)
        if: ${{ steps.find-pr.outputs.skip != 'true' }}
        # Allure 2.43 still embeds a GTM snippet despite the env opt-out;
        # remove it deterministically so the private dashboard never phones
        # home (the /e2e CSP also excludes external origins).
        run: node scripts/strip-allure-analytics.mjs allure-report

      - name: Privacy/secrets scan of generated report
        if: ${{ steps.find-pr.outputs.skip != 'true' }}
        run: node scripts/check-allure-privacy.mjs allure-report

      - name: Upload report to R2 (private, not the repo)
        if: ${{ steps.find-pr.outputs.skip != 'true' && vars.ALLURE_PUBLISH_READY == '1' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Wrangler R2 single bucket/key path; --content-type preserves MIME.
          cd allure-report
          for f in $(find . -type f); do
            key="${f#./}"
            ct="application/octet-stream"
            case "$key" in
              *.html) ct="text/html; charset=utf-8" ;;
              *.js)   ct="application/javascript" ;;
              *.css)  ct="text/css" ;;
              *.json) ct="application/json" ;;
              *.svg)  ct="image/svg+xml" ;;
              *.png)  ct="image/png" ;;
              *.jpg|*.jpeg) ct="image/jpeg" ;;
              *.gif)  ct="image/gif" ;;
              *.woff2) ct="font/woff2" ;;
              *.woff) ct="font/woff" ;;
              *.webp) ct="image/webp" ;;
            esac
            npx wrangler r2 object put "$E2E_REPORT_BUCKET/$key" --file "$f" --content-type "$ct" --remote
          done
          echo "Uploaded $(find . -type f | wc -l) files to R2 bucket $E2E_REPORT_BUCKET"

      - name: Privacy gate not ready — report staged, not published
        if: ${{ steps.find-pr.outputs.skip != 'true' && vars.ALLURE_PUBLISH_READY != '1' }}
        run: |
          echo "::warning::ALLURE_PUBLISH_READY is not set to 1. The report was generated and privacy-scanned but NOT uploaded to R2. Set the repository variable ALLURE_PUBLISH_READY=1 after inspecting a representative report."
