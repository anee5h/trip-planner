# KAI-126: publish the aggregated Allure E2E dashboard to PRIVATE R2 storage.
#
# Runs on push to main (post-merge). It re-runs the FULL KAI-99 topology —
# the same 4 weighted bins x 2 projects plus the dedicated PWA production
# E2E job — then aggregates all allure-results and uploads the generated
# report to a private Cloudflare R2 bucket. The dashboard is served at
# /e2e ONLY through the Access-guarded Pages Function (functions/e2e/[[path]].js);
# the R2 bucket has no public access, and NOTHING is committed to this repo.
#
# History (KAI-126): Allure 2 requires the previous report's history/
# directory to be copied into the result set BEFORE generation. We download
# the previous report from R2, extract history/ into allure-results/, then
# generate. Bounded retention: 30 days (older history is dropped by R2
# lifecycle rules; the code also prunes history entries beyond 90 runs).
#
# Requires owner-provided secrets:
#   CLOUDFLARE_API_TOKEN  (wrangler:edit on the R2 bucket)
#   CLOUDFLARE_ACCOUNT_ID
#   E2E_REPORT_BUCKET     (R2 bucket name; default E2E_REPORT)
#
# Metadata: an executor.json is written into the result set before
# generation, carrying commit SHA, branch, PR and workflow-run links, so
# the dashboard shows which CI build produced it.

name: Allure Publish (R2)

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: allure-publish
  cancel-in-progress: true

env:
  E2E_REPORT_BUCKET: ${{ vars.E2E_REPORT_BUCKET || 'E2E_REPORT' }}

jobs:
  e2e:
    name: E2E (${{ matrix.project }} bin ${{ matrix.bin }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, chromium-desktop]
        bin: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Playwright E2E (bin ${{ matrix.bin }}/4 · ${{ matrix.project }})
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --project=${{ matrix.project }} $(node scripts/e2e-shards.mjs --bin ${{ matrix.bin }}) 2>&1 | tee /tmp/e2e-output.log

      - name: Upload Allure results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}-bin${{ matrix.bin }}
          path: allure-results/
          if-no-files-found: ignore

  pwa-e2e:
    name: PWA E2E (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install chromium

      - name: PWA E2E against the production build
        run: npm run test:pwa

      - name: Upload Allure results (PWA)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-pwa
          path: allure-results/
          if-no-files-found: ignore

  aggregate-and-publish:
    name: Aggregate + publish to R2
    runs-on: ubuntu-latest
    needs: [e2e, pwa-e2e]
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results from all E2E jobs
        uses: actions/download-artifact@v4
        with:
          path: allure-download
          pattern: allure-results-*
          merge-multiple: true

      - name: Restore previous report history from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p previous-report
          npx wrangler r2 object get "$E2E_REPORT_BUCKET" "history/history.json" --remote \
            -o previous-report/history.json 2>/dev/null || echo "no previous history (first run)"
          # Allure 2 history: copy previous report's history/ into the NEW
          # result set BEFORE generation (documented Allure mechanism).
          if [ -f previous-report/history.json ]; then
            mkdir -p allure-download/history
            cp previous-report/history.json allure-download/history/
            echo "restored previous history"
          fi

      - name: Write executor.json (CI metadata)
        run: |
          cat > allure-download/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildName": "${{ github.ref_name }} @ ${{ github.sha }}",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "reportName": "Meguruto E2E Dashboard",
            "reportUrl": "https://meguruto.app/e2e"
          }
          EOF
          echo "executor.json written"

      - name: Generate Allure report
        run: |
          npx allure generate allure-download -o allure-report --clean
          echo "Allure report generated."

      - name: Upload report to R2 (private, not the repo)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Upload the full report tree to the private bucket.
          for f in $(find allure-report -type f); do
            key="${f#allure-report/}"
            npx wrangler r2 object put "$E2E_REPORT_BUCKET" "$key" --file "$f" --remote
          done
          echo "Uploaded $(find allure-report -type f | wc -l) files to R2 bucket $E2E_REPORT_BUCKET"
