name: Debug Workflow Run Event

on:
  workflow_run:
    workflows: ["PR Checks"]
    types: [completed]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Dump workflow_run event fields
        env:
          WR_EVENT: ${{ github.event.workflow_run.event }}
          WR_HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          WR_REPO: ${{ github.repository }}
          WR_PR0: ${{ github.event.workflow_run.pull_requests[0] }}
          WR_PR0_BASE: ${{ github.event.workflow_run.pull_requests[0].base.repo.full_name }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "event=$WR_EVENT"
          echo "head_repo=$WR_HEAD_REPO"
          echo "repo=$WR_REPO"
          echo "pr0=$WR_PR0"
          echo "pr0_base=$WR_PR0_BASE"
          echo "sha=$WR_SHA"
          echo "decision=${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.head_repository.full_name == github.repository }}"
