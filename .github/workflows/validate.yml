name: Meguruto Data Quality & CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev, "data/collections-*"]
  schedule:
    - cron: "0 19 * * *" # nightly 19:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Fast Validation
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Check Translation Resource Parity
        run: npm run check:translation-parity

      - name: Generate Editorial Freshness Report
        run: npm run report:editorial-freshness

  changed-images-push:
    name: Changed Catalogue Images (Push)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE_VALIDATION_MAX_CONCURRENT_REQUESTS: "2"
    steps:
      - name: Checkout code with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate changed destination images
        env:
          IMAGE_DIFF_BASE: ${{ github.event.before }}
        run: npm run validate:images:changed -- --base-ref "$IMAGE_DIFF_BASE"

  validate-full:
    name: Deterministic Data Quality
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Deterministic Data Quality Framework
        run: npm run validate-all -- --profile deterministic

      - name: Check Translation Resource Parity
        run: npm run check:translation-parity

      - name: Generate Editorial Freshness Report
        run: npm run report:editorial-freshness

      - name: Upload Validation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deterministic-validation-reports
          path: reports/

  image-monitor:
    name: Catalog Image Monitor
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_VALIDATION_MAX_CONCURRENT_REQUESTS: "2"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run full remote image monitor
        run: npm run validate:images:full

      - name: Upload image validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-validation-report
          path: |
            reports/image-validation-all.json
            reports/image-validation-all.md
          if-no-files-found: ignore
