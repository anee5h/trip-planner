name: TabiMap Data Quality & CI Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Type Check
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Run Data Quality Framework
        run: npm run validate-all

      - name: Check Translation Resource Parity
        run: npm run check:translation-parity

      - name: Generate Editorial Freshness Report
        run: npm run report:editorial-freshness
