name: Security smoke

on:
  schedule:
    # Daily 15:00 JST — verifies production still serves the required
    # security policies and no secrets leaked into the built bundle.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (for bundle-secret scan)
        run: npm run build

      - name: Secrets in bundle
        run: npm run check:bundle-secrets

      - name: Production security headers
        # The Pages production alias avoids the custom-domain edge challenge
        # while still reaching the production deployment. The verifier checks
        # the embedded deployment SHA, so this cannot silently become a preview
        # or unrelated deployment. It does not weaken headers or treat 403 as
        # success; challenged responses remain exit code 2.
        env:
          SECURITY_SMOKE_BASE_URL: https://tabimap-cld.pages.dev
          EXPECTED_DEPLOYMENT_SHA: ${{ github.ref == 'refs/heads/main' && github.sha || '' }}
        run: npm run check:security-headers
