name: PR Checks

on:
  pull_request:
    branches: [main, "data/collections-*"]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Translation Parity
        run: npm run validate:i18n

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests
        run: npm run test:run -- --maxWorkers=2

  e2e:
    name: E2E (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # KAI-99 phase 1: partition the ~21 min suite across four independent
    # runners. Each shard still runs 2 workers internally. Measure the actual
    # shard and wall-clock times in CI; do not infer balance from file counts.
    # fail-fast: false keeps one flaky shard from cancelling the others'
    # evidence.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (shard ${{ matrix.shard }}/4)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: test-results/
          if-no-files-found: ignore

  pwa-e2e:
    name: PWA E2E (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: PWA E2E against the production build
        run: npm run test:pwa

      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pwa
          path: test-results/
          if-no-files-found: ignore

  catalogue-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fast Catalogue Validation
        run: npm run validate:catalog-fast

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SEO outputs current & deterministic
        run: npm run seo:check

      - name: Bundle budget
        run: npm run check:bundle-budget

      - name: Secrets in bundle
        run: npm run check:bundle-secrets

      - name: PWA manifest & worker policy
        run: npm run check:pwa

  changed-external:
    name: changed-external
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Changed destination images
        run: npm run validate:images:changed

      - name: Changed destination links
        run: npm run validate:links:changed
