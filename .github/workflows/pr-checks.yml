name: PR Checks

on:
  pull_request:
    branches: [main, "data/collections-*"]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Translation Parity
        run: npm run validate:i18n

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests
        run: npm run test:run -- --maxWorkers=2

  e2e:
    name: E2E (${{ matrix.project }} bin ${{ matrix.bin }}/4)
    runs-on: ubuntu-latest
    # KAI-99 phase 2: deterministic weighted file bins instead of
    # --shard round-robin. With fullyParallel:false, Playwright shards at
    # FILE granularity (not per-test round-robin), and Meguruto's spec
    # files have highly unequal execution weights across two projects —
    # the old 4-shard walls were ~14 min for bins 1/4 and 3/4 vs ~3.5 min
    # for bins 2/4 and 4/4, and the heavy shard exceeded the 20-min job
    # ceiling on contended runners. Bin contents are the single source of
    # truth in scripts/e2e-shards.mjs (measured per-spec CI weights; the
    # e2e-coverage job below fails CI if a spec is ever left unassigned).
    # Each job runs ONE project over ONE bin: ~4-8 min of tests per job,
    # all 8 jobs parallel. 30m = hung-job guard: the ceiling is dominated
    # by SETUP variance (npm ci on shared runners occasionally takes 20+
    # min cold-cache/contended — observed 2026-08-18, 3 jobs killed inside
    # npm ci before any test ran), not by the balanced test phase.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, chromium-desktop]
        bin: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # No --with-deps: the apt phase hung 20-30 min on hosted runners
        # (observed 2026-08-18, killed inside apt-get before any browser
        # download). ubuntu-latest ships Chromium's system libraries; the
        # browser download itself is covered by the cache step above.
        run: npx playwright install chromium

      - name: Playwright E2E (bin ${{ matrix.bin }}/4 · ${{ matrix.project }})
        shell: bash
        env:
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          CI_BIN: ${{ matrix.bin }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -o pipefail
          npx playwright test --project=${{ matrix.project }} $(node scripts/e2e-shards.mjs --bin ${{ matrix.bin }}) 2>&1 | tee /tmp/e2e-output.log

      - name: E2E timing summary (runtime visibility)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "Slowest tests in this bin/project:"
          grep -oE "\[[a-z-]+\] › [^(]*\([0-9.]+s\)" /tmp/e2e-output.log 2>/dev/null \
            | sed -E 's/.*\(([0-9.]+)s\)$/\1s  &/' | sort -rn | head -5 || true

      - name: Privacy scan Playwright test-results (public repo artifacts)
        id: scan-test-results
        if: ${{ !cancelled() }}
        # test-results/ holds screenshots + traces (may embed network/auth
        # context). BLOCKING scan before upload; also removes binary
        # attachments (screenshots/videos) that a regex scanner cannot
        # declare safe from the public artifact set.
        run: node scripts/check-allure-privacy.mjs test-results --sanitize

      - name: Upload Playwright failure artifacts
        # Explicit status function bypasses the implicit success() gate so a
        # FAILED test run still uploads diagnostics (privacy-passing only).
        if: ${{ !cancelled() && steps.scan-test-results.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-bin${{ matrix.bin }}
          path: test-results/
          if-no-files-found: ignore

      - name: Privacy scan Allure results (public repo artifacts)
        id: scan-allure
        if: ${{ !cancelled() }}
        # The repo is public; Actions artifacts are readable by anyone with
        # read access. BLOCKING: fail the job if allure-results contain
        # unallowlisted emails/JWTs/secrets BEFORE they are uploaded.
        # --sanitize removes binary screenshots/videos (uninspectable) so
        # public artifacts carry text/trace diagnostics only.
        run: node scripts/check-allure-privacy.mjs allure-results --sanitize

      - name: Upload Allure results
        if: ${{ !cancelled() && steps.scan-allure.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.project }}-bin${{ matrix.bin }}
          path: allure-results/
          if-no-files-found: ignore

  e2e-coverage:
    name: E2E shard coverage guard
    runs-on: ubuntu-latest
    # Fails the PR if scripts/e2e-shards.mjs no longer assigns every
    # discovered e2e spec to exactly one bin (a newly added spec would
    # otherwise silently never run).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shard manifest coverage
        run: node scripts/e2e-shards.mjs --check

  pwa-e2e:
    name: PWA E2E (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # No --with-deps: the apt phase hung 20-30 min on hosted runners
        # (observed 2026-08-18, killed inside apt-get before any browser
        # download). ubuntu-latest ships Chromium's system libraries; the
        # browser download itself is covered by the cache step above.
        run: npx playwright install chromium

      - name: PWA E2E against the production build
        env:
          PLAYWRIGHT_PROJECT: pwa
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: npm run test:pwa

      - name: Privacy scan Playwright test-results (PWA — public repo artifacts)
        id: scan-pwa-test-results
        if: ${{ !cancelled() }}
        run: node scripts/check-allure-privacy.mjs test-results --sanitize

      - name: Upload Playwright failure artifacts
        # Explicit status function bypasses the implicit success() gate so a
        # FAILED test run still uploads diagnostics (privacy-passing only).
        if: ${{ !cancelled() && steps.scan-pwa-test-results.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pwa
          path: test-results/
          if-no-files-found: ignore

      - name: Privacy scan Allure results (PWA — public repo artifacts)
        id: scan-pwa-allure
        if: ${{ !cancelled() }}
        run: node scripts/check-allure-privacy.mjs allure-results --sanitize

      - name: Upload Allure results (PWA)
        if: ${{ !cancelled() && steps.scan-pwa-allure.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-pwa
          path: allure-results/
          if-no-files-found: ignore

  allure-report:
    name: Allure report (aggregate + preview)
    runs-on: ubuntu-latest
    needs: [e2e, pwa-e2e, a11y-e2e]
    if: ${{ always() }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Allure results from all E2E jobs
        uses: actions/download-artifact@v4
        with:
          path: allure-download
          pattern: allure-results-*
          merge-multiple: true

      - name: Generate Allure report
        run: |
          npx allure generate allure-download -o allure-report --clean
          echo "Allure report generated."

      - name: Strip GTM analytics from generated HTML
        run: node scripts/strip-allure-analytics.mjs allure-report

      # PR context cannot push (GITHUB_REF is refs/pull/N/merge, and GitHub
      # denies updating that hidden ref). The report is uploaded as an
      # artifact for inspection; publishing to the private R2 store happens
      # post-merge via .github/workflows/allure-publish.yml (push to main).
      - name: Privacy scan generated report (public repo artifacts)
        id: scan-report-preview
        run: node scripts/check-allure-privacy.mjs allure-report

      - name: Upload Allure report artifact
        if: ${{ !cancelled() && steps.scan-report-preview.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-preview
          path: allure-report/
          retention-days: 14

  protected-routes:
    name: Protected-route boundary checks (KAI-126)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # Same no--with-deps policy as the KAI-99 E2E jobs (the browser
        # smoke step boots the real Allure report in Chromium).
        run: npx playwright install chromium

      - name: Build Pages assets (hermetic — wrangler pages dev needs dist/)
        # The boundary test boots `wrangler pages dev dist`; dist/ must
        # exist and contain index.html for the /qa ASSETS fetch to work.
        run: npm run build

      - name: Deterministic auth boundary tests (real JWKS + signed JWTs)
        # Generates a throwaway RSA keypair, runs a local JWKS server, and
        # exercises no-token/malformed/expired/wrong-aud/wrong-issuer/bad-sig
        # deny paths plus the valid-token allow path against the real Pages
        # Function via wrangler dev, and boots the real Allure report in
        # Chromium (browser smoke).
        run: node scripts/check-protected-routes.mjs

      - name: Allure history + failure-fixture checks (deterministic)
        # Controlled failing-report fixture (failure + attachment) and a
        # two-run history-continuity test (run A -> history -> run B),
        # exercising the exact restore mechanism the publisher uses.
        run: node scripts/check-allure-history.mjs

  a11y-build:
    name: A11y production build (built once)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets (KAI-80 a11y preview + fake-Supabase fixture)
        # KAI-80: a11y runs against the production preview with the fake
        # a11y-test Supabase project so the authenticated-state fixture
        # works; built ONCE, shared by both a11y project jobs.
        run: |
          VITE_SUPABASE_URL=https://a11y-test.supabase.co VITE_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.a11y-test-anon-key npm run build

      - name: Upload built dist
        uses: actions/upload-artifact@v4
        with:
          name: a11y-dist
          path: dist/
          retention-days: 1

  a11y-e2e:
    name: A11y E2E (${{ matrix.project }}) — WCAG 2.2 AA gate
    runs-on: ubuntu-latest
    needs: [a11y-build]
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, chromium-desktop]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # Same no--with-deps policy as the E2E jobs (KAI-99).
        run: npx playwright install chromium

      - name: Download built dist (built once in a11y-build)
        uses: actions/download-artifact@v4
        with:
          name: a11y-dist
          path: dist/

      - name: A11y E2E (representative major-route matrix, WCAG 2.2 AA)
        shell: bash
        env:
          A11Y_E2E: "1"
          A11Y_PREBUILT: "1"
          PLAYWRIGHT_PROJECT: ${{ matrix.project }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -o pipefail
          npx playwright test --project=${{ matrix.project }} e2e/kai-80-a11y.spec.ts 2>&1 | tee /tmp/a11y-output.log

      - name: Privacy scan A11y test results (public repo artifacts)
        id: scan-a11y-testresults
        if: ${{ !cancelled() }}
        run: node scripts/check-allure-privacy.mjs test-results --sanitize

      - name: Upload A11y failure artifacts
        if: ${{ !cancelled() && steps.scan-a11y-testresults.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-a11y-${{ matrix.project }}
          path: test-results/
          if-no-files-found: ignore

      - name: Privacy scan A11y Allure results (public repo artifacts)
        id: scan-a11y-allure
        if: ${{ !cancelled() }}
        run: node scripts/check-allure-privacy.mjs allure-results --sanitize

      - name: Upload A11y Allure results
        if: ${{ !cancelled() && steps.scan-a11y-allure.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-a11y-${{ matrix.project }}
          path: allure-results/
          if-no-files-found: ignore

  catalogue-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fast Catalogue Validation
        run: npm run validate:catalog-fast

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SEO outputs current & deterministic
        run: npm run seo:check

      - name: Bundle budget
        run: npm run check:bundle-budget

      - name: Secrets in bundle
        run: npm run check:bundle-secrets

      - name: PWA manifest & worker policy
        run: npm run check:pwa

  changed-external:
    name: changed-external
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Changed destination images
        run: npm run validate:images:changed

      - name: Changed destination links
        run: npm run validate:links:changed
