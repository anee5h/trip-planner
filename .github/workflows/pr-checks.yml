name: PR Checks

on:
  pull_request:
    branches: [main, "data/collections-*"]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc -b --noEmit

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Translation Parity
        run: npm run validate:i18n

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit Tests
        run: npm run test:run -- --maxWorkers=2

  e2e:
    name: E2E (${{ matrix.project }} bin ${{ matrix.bin }}/4)
    runs-on: ubuntu-latest
    # KAI-99 phase 2: deterministic weighted file bins instead of
    # --shard round-robin. With fullyParallel:false, Playwright shards at
    # FILE granularity (not per-test round-robin), and Meguruto's spec
    # files have highly unequal execution weights across two projects —
    # the old 4-shard walls were ~14 min for bins 1/4 and 3/4 vs ~3.5 min
    # for bins 2/4 and 4/4, and the heavy shard exceeded the 20-min job
    # ceiling on contended runners. Bin contents are the single source of
    # truth in scripts/e2e-shards.mjs (measured per-spec CI weights; the
    # e2e-coverage job below fails CI if a spec is ever left unassigned).
    # Each job runs ONE project over ONE bin: ~4-8 min of tests per job,
    # all 8 jobs parallel. 30m = hung-job guard: the ceiling is dominated
    # by SETUP variance (npm ci on shared runners occasionally takes 20+
    # min cold-cache/contended — observed 2026-08-18, 3 jobs killed inside
    # npm ci before any test ran), not by the balanced test phase.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [chromium-mobile, chromium-desktop]
        bin: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E (bin ${{ matrix.bin }}/4 · ${{ matrix.project }})
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --project=${{ matrix.project }} $(node scripts/e2e-shards.mjs --bin ${{ matrix.bin }}) 2>&1 | tee /tmp/e2e-output.log

      - name: E2E timing summary (runtime visibility)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          echo "Slowest tests in this bin/project:"
          grep -oE "\[[a-z-]+\] › [^(]*\([0-9.]+s\)" /tmp/e2e-output.log 2>/dev/null \
            | sed -E 's/.*\(([0-9.]+)s\)$/\1s  &/' | sort -rn | head -5 || true

      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}-bin${{ matrix.bin }}
          path: test-results/
          if-no-files-found: ignore

  e2e-coverage:
    name: E2E shard coverage guard
    runs-on: ubuntu-latest
    # Fails the PR if scripts/e2e-shards.mjs no longer assigns every
    # discovered e2e spec to exactly one bin (a newly added spec would
    # otherwise silently never run).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shard manifest coverage
        run: node scripts/e2e-shards.mjs --check

  pwa-e2e:
    name: PWA E2E (production build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: PWA E2E against the production build
        run: npm run test:pwa

      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-pwa
          path: test-results/
          if-no-files-found: ignore

  catalogue-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fast Catalogue Validation
        run: npm run validate:catalog-fast

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SEO outputs current & deterministic
        run: npm run seo:check

      - name: Bundle budget
        run: npm run check:bundle-budget

      - name: Secrets in bundle
        run: npm run check:bundle-secrets

      - name: PWA manifest & worker policy
        run: npm run check:pwa

  changed-external:
    name: changed-external
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Changed destination images
        run: npm run validate:images:changed

      - name: Changed destination links
        run: npm run validate:links:changed
