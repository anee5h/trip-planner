name: Destination Checks

on:
  pull_request:
    branches: [main]
    paths:
      - "public/data/destinations/**"
      - "src/shared/data/destinations-index.json"
      - "scripts/validators/**"
      - "scripts/audit/**"

permissions:
  contents: read

jobs:
  validate-catalogue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fast Catalogue Validation
        run: npm run validate:catalog-fast
